<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary" th:fragment="navbar(active)">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/dashboard}">
            <i class="bi bi-kanban"></i> プロジェクト管理
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active} == 'dashboard' ? ' active'" th:href="@{/dashboard}">
                        <i class="bi bi-house"></i> ダッシュボード
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active} == 'projects' ? ' active'" th:href="@{/projects}">
                        <i class="bi bi-folder"></i> プロジェクト
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active} == 'tasks' ? ' active'" th:href="@{/tasks}">
                        <i class="bi bi-list-task"></i> タスク
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i> <span th:text="${username}">ユーザー</span>
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#"><i class="bi bi-person"></i> プロフィール</a></li>
                        <li><a class="dropdown-item" href="#"><i class="bi bi-gear"></i> 設定</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="dropdown-item">
                                    <i class="bi bi-box-arrow-right"></i> ログアウト
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
