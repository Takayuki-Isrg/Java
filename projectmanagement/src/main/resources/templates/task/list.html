<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>タスク一覧 - プロジェクト管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.projectmanagement.css">
</head>
<body>
    <!-- ナビゲーションバー -->
    <div th:replace="fragments/navbar :: navbar('tasks')"></div>

    <!-- メインコンテンツ -->
    <div class="container-fluid mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h2 class="mb-0">
                    <i class="bi bi-list-task"></i> タスク一覧
                </h2>
                <p class="text-muted mb-0">登録されているタスクの一覧です。</p>
            </div>
            <div>
                <a class="btn btn-primary" th:href="@{/tasks/new}">
                    <i class="bi bi-plus-circle"></i> 新しいタスク
                </a>
            </div>
        </div>

        <!-- フィルタフォーム -->
        <div class="card mb-3">
            <div class="card-body">
                <form class="row g-2" id="filterForm">
                    <div class="col-md-4">
                        <input type="text" 
                               class="form-control" 
                               id="searchKeyword"
                               placeholder="キーワード検索（タイトル、説明）">
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="filterAssignee">
                            <option value="">担当者</option>
                            <!-- 動的に追加される -->
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="filterPriority">
                            <option value="">優先度</option>
                            <option value="HIGH">High</option>
                            <option value="MEDIUM">Medium</option>
                            <option value="LOW">Low</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="filterStatus">
                            <option value="">ステータス</option>
                            <option value="TODO">未着手</option>
                            <option value="IN_PROGRESS">進行中</option>
                            <option value="DONE">完了</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="button" class="btn btn-primary w-100" id="searchButton">
                            <i class="bi bi-search"></i> 検索
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- タスクテーブル -->
        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th scope="col">タイトル</th>
                                <th scope="col">担当者</th>
                                <th scope="col">期限</th>
                                <th scope="col">優先度</th>
                                <th scope="col">ステータス</th>
                                <th scope="col" class="text-end">操作</th>
                            </tr>
                        </thead>
                        <tbody id="taskTableBody">
                            <tr th:if="${#lists.isEmpty(tasks)}">
                                <td colspan="6" class="text-center text-muted py-4">
                                    まだタスクが登録されていません。
                                </td>
                            </tr>
                            <!-- タスク行は動的に追加される -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- API Utils -->
    <script src="/js/api-utils.js"></script>
    <!-- Task List Script -->
    <script src="/js/task-list.js"></script>
</body>
</html>
