<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="_csrf" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:content="${_csrf.headerName}">
        <title>パスワード再設定 - プロジェクト管理</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" href="/css/style.projectmanagement.css">
    </head>
    <body>
        <div class="container">
            <div class="row justify-content-center align-items-center" style="height:100vh;">
                <div class="col-4">
                    <div class="card p-4">
                        <div class="card-body">
                            <h3 class="text-center mb-4">パスワード再設定</h3>

                            <!-- 成功メッセージ -->
                            <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                                <i class="bi bi-check-circle-fill"></i>
                                <span th:text="${message}">パスワード再設定メールを送信しました。</span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>

                            <!-- エラーメッセージ -->
                            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                                <i class="bi bi-exclamation-triangle-fill"></i>
                                <span th:text="${error}">ユーザーが見つかりませんでした。</span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>

                            <!-- パスワード再設定メール送信フォーム -->
                            <form action="/reset-password" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                
                                <div class="mb-3">
                                    <label for="email" class="form-label">登録メールアドレス</label>
                                    <input type="email"
                                           class="form-control"
                                           id="email"
                                           name="email"
                                           placeholder="example@domain.com"
                                           required>
                                </div>

                                <button type="submit" class="btn btn-primary w-100">
                                    パスワード再設定メールを送信
                                </button>
                            </form>

                            <div class="mt-3 text-center">
                                <a href="/login">ログイン画面へ戻る</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Axios -->
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <!-- API Utils -->
        <script src="/js/api-utils.js"></script>
        <!-- Reset Password Script -->
        <script src="/js/reset-password.js"></script>
    </body>
</html>
